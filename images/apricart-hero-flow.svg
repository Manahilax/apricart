<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="660" height="420" viewBox="0 20 660 420" fill="none">
  <style>
    .w     { fill: #fff; }
    .line  { stroke: #fff; stroke-width: 1.5; }
    .dash  { stroke: #FFD23F; stroke-width: 2; stroke-linecap: round; }

    /* left: dashes flowing into the hub */
    .flow  { stroke-dasharray: 8 72; animation: flow 3.2s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -80; } }

    /* right: one dash out to each box ... */
    .send  { stroke-dasharray: 14 200; stroke-dashoffset: 14; animation: send 2.8s linear infinite; }
    @keyframes send { 45%, 100% { stroke-dashoffset: -100; } }

    /* ... then the box dot lights up */
    .lit   { fill: #FFD23F; opacity: 0; animation: lit 2.8s linear infinite; }
    @keyframes lit { 0%, 45% { opacity: 0; } 50%, 90% { opacity: 1; } }

    /* hub centre pulse */
    .pulse { fill: #FFD23F; animation: pulse 2.6s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
  </style>

  <defs>
    <!-- lines from the suppliers into the hub -->
    <path id="l1" d="M19 69C149 69 170 230 272 230"/>
    <path id="l2" d="M71 119C201 119 170 230 272 230"/>
    <path id="l3" d="M17 179C147 179 170 230 272 230"/>
    <path id="l4" d="M76 220C206 220 170 230 272 230"/>
    <path id="l5" d="M22 276C152 276 170 230 272 230"/>
    <path id="l6" d="M74 328C204 328 170 230 272 230"/>
    <path id="l7" d="M24 378C154 378 170 230 272 230"/>

    <!-- lines from the hub out to the boxes -->
    <g id="out">
      <path d="M386 230C404 230 406 82 420 82"   pathLength="100"/>
      <path d="M386 230C404 230 406 150 420 150" pathLength="100"/>
      <path d="M386 230C404 230 406 218 420 218" pathLength="100"/>
      <path d="M386 230C404 230 406 286 420 286" pathLength="100"/>
      <path d="M386 230C404 230 406 354 420 354" pathLength="100"/>
    </g>

    <!-- one location box (centred on y = 0) -->
    <g id="box">
      <rect x="440" y="-22" width="200" height="44" rx="12" class="w" opacity=".08"/>
      <rect x="440.75" y="-21.25" width="198.5" height="42.5" rx="11.25" class="line" opacity=".85"/>
      <circle cx="424" cy="0" r="4" class="w" opacity=".9"/>
      <circle cx="460" cy="0" r="5" class="w" opacity=".35"/>
    </g>
  </defs>

  <!-- LEFT: supplier lines + flowing dashes -->
  <g class="line" opacity=".3">
    <use href="#l1" xlink:href="#l1"/><use href="#l2" xlink:href="#l2"/><use href="#l3" xlink:href="#l3"/>
    <use href="#l4" xlink:href="#l4"/><use href="#l5" xlink:href="#l5"/><use href="#l6" xlink:href="#l6"/>
    <use href="#l7" xlink:href="#l7"/>
  </g>
  <g class="dash">
    <use href="#l1" xlink:href="#l1" class="flow"/>
    <use href="#l2" xlink:href="#l2" class="flow" style="animation-delay: -.46s"/>
    <use href="#l3" xlink:href="#l3" class="flow" style="animation-delay: -.91s"/>
    <use href="#l4" xlink:href="#l4" class="flow" style="animation-delay: -1.37s"/>
    <use href="#l5" xlink:href="#l5" class="flow" style="animation-delay: -1.83s"/>
    <use href="#l6" xlink:href="#l6" class="flow" style="animation-delay: -2.29s"/>
    <use href="#l7" xlink:href="#l7" class="flow" style="animation-delay: -2.74s"/>
  </g>

  <!-- supplier blocks -->
  <g class="w" opacity=".92">
    <rect x="10" y="60"  width="18" height="18" rx="4"/>
    <rect x="64" y="112" width="14" height="14" rx="4"/>
    <rect x="6"  y="168" width="22" height="22" rx="4"/>
    <rect x="70" y="214" width="13" height="13" rx="4"/>
    <rect x="14" y="268" width="17" height="17" rx="4"/>
    <rect x="66" y="320" width="15" height="15" rx="4"/>
    <rect x="18" y="372" width="12" height="12" rx="4"/>
  </g>

  <!-- RIGHT: hub lines, outgoing dash, boxes -->
  <use href="#out" xlink:href="#out" class="line" opacity=".55"/>
  <use href="#out" xlink:href="#out" class="dash send"/>

  <use href="#box" xlink:href="#box" y="82"/>
  <use href="#box" xlink:href="#box" y="150"/>
  <use href="#box" xlink:href="#box" y="218"/>
  <use href="#box" xlink:href="#box" y="286"/>
  <use href="#box" xlink:href="#box" y="354"/>

  <!-- yellow dots that light up when the dash arrives -->
  <g class="lit">
    <circle cx="460" cy="82" r="5"/><circle cx="460" cy="150" r="5"/><circle cx="460" cy="218" r="5"/>
    <circle cx="460" cy="286" r="5"/><circle cx="460" cy="354" r="5"/>
  </g>

  <g class="w" opacity=".4">
    <rect x="476" y="78"  width="104" height="8" rx="4"/>
    <rect x="476" y="146" width="84"  height="8" rx="4"/>
    <rect x="476" y="214" width="120" height="8" rx="4"/>
    <rect x="476" y="282" width="92"  height="8" rx="4"/>
    <rect x="476" y="350" width="72"  height="8" rx="4"/>
  </g>

  <!-- HUB -->
  <rect x="280" y="180" width="100" height="100" rx="28" fill="#2B55E6"/>
  <g class="w" opacity=".85">
    <circle cx="312" cy="212" r="6"/><circle cx="348" cy="212" r="6"/>
    <circle cx="312" cy="248" r="6"/><circle cx="348" cy="248" r="6"/>
  </g>
  <circle cx="330" cy="230" r="9" class="pulse"/>
</svg>
