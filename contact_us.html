<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us — Apricart</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap');

  :root{
    --navy:#002072;
    --navy-900:#002072;
    --navy-deep:#020a2e;
    --blue:#2145D8;
    --blue-accent:#2145D8;
    --yellow:#F9D857;
    --yellow-400:#F9D857;
    --yellow-500:#F0C238;
    --ink:#0b0f1a;
    --paper:#ffffff;
    --line:rgba(255,255,255,0.14);
    --text-primary:#131B3A;
    --border:#E2E8F4;
    --radius-pill:999px;
  }

  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Montserrat',sans-serif;
    background:#e9edf5;
    color:var(--ink);
    min-height:100vh;
  }

  
  .nv-wide{max-width:100%;margin:0 auto;padding:0 40px;}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:15px 28px;border-radius:var(--radius-pill);font-weight:700;font-size:14.5px;border:2px solid transparent;white-space:nowrap;font-family:inherit;text-decoration:none;cursor:pointer;}
  .btn svg{width:10px;height:10px;}
  .btn-primary{background:var(--yellow-400);color:var(--navy-900);}
  .btn-outline{background:transparent;border-color:var(--navy-900);color:var(--navy-900);}
  .nv-header{background:#fff;border-bottom:1px solid var(--border);}
  .nv-header .nv-wide{display:flex;align-items:center;justify-content:space-between;padding:22px 40px;gap:20px;}
  .nv-brand img{height:80px;width:auto;display:block;}
  .nv-nav{display:flex;align-items:center;gap:34px;}
  .nv-nav a{font-weight:600;font-size:14px;color:var(--text-primary);padding-bottom:4px;border-bottom:2px solid transparent;text-decoration:none;}
  .nv-nav a.is-active{border-bottom-color:var(--yellow-500);color:var(--navy-900);}
  .nv-header-actions{display:flex;align-items:center;gap:14px;}
  .btn-sm{padding:10px 18px;font-size:13px;}

  @media (max-width:900px){ .nv-nav{display:none;} }

  .page-body{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:48px 20px;
  }

  .stage{
    width:100%;
    max-width:1360px;
  }

  .panel{
    position:relative;
    background:linear-gradient(155deg,var(--navy-deep) 0%,var(--navy) 55%,#031240 100%);
    border-radius:28px;
    overflow:hidden;
    min-height:700px;
    box-shadow:0 40px 80px -30px rgba(2,10,46,0.55);
  }


  .content-wrap{
    position:relative;
    z-index:3;
    display:grid;
    grid-template-columns:1.05fr 0.95fr;
    align-items:stretch;
    min-height:700px;
  }

  .left-col{
    padding:56px 40px 48px 56px;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
  }

  h1.headline{
    color:#fff;
    font-size:clamp(40px,4.4vw,58px);
    font-weight:800;
    letter-spacing:-0.01em;
    line-height:1.02;
    margin-bottom:56px;
  }

  .info-row{
    display:flex;
    gap:64px;
    flex-wrap:wrap;
  }

  .info-block .label{
    color:var(--yellow);
    font-size:11px;
    font-weight:700;
    letter-spacing:0.14em;
    text-transform:uppercase;
    margin-bottom:14px;
  }
  .info-block p{
    color:rgba(255,255,255,0.82);
    font-size:14.5px;
    line-height:1.7;
    font-weight:500;
  }
  .info-block a{color:inherit;text-decoration:none;}
  .info-block a:hover{color:#fff;}

  .socials{
    margin-top:40px;
    display:flex;
    align-items:center;
    gap:16px;
  }
  .socials .follow{
    color:rgba(255,255,255,0.55);
    font-size:12px;
    font-weight:600;
    letter-spacing:0.04em;
    margin-right:4px;
  }
  .socials a{
    width:36px;
    height:36px;
    border-radius:50%;
    border:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    text-decoration:none;
    transition:background 0.15s ease, border-color 0.15s ease;
  }
  .socials a:hover{background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.3);}
  .socials svg{width:16px;height:16px;}

  /* form card */
  .form-card{
    background:#fff;
    border-radius:22px;
    margin:40px 40px 40px 0;
    padding:44px 44px 40px;
    box-shadow:0 30px 60px -20px rgba(2,10,46,0.45);
    display:flex;
    flex-direction:column;
    justify-content:center;
  }

  .form-card .tag{
    color:#9aa1b5;
    font-size:11px;
    font-weight:700;
    letter-spacing:0.16em;
    text-transform:uppercase;
    margin-bottom:34px;
  }

  .field{
    position:relative;
    margin-bottom:26px;
  }
  .field label{
    display:block;
    font-size:12.5px;
    font-weight:600;
    color:#8b93a7;
    margin-bottom:10px;
  }
  .field input,
  .field textarea{
    width:100%;
    border:none;
    border-bottom:1.5px solid #e3e6ee;
    padding:6px 2px 12px;
    font-family:inherit;
    font-size:15px;
    font-weight:600;
    color:var(--ink);
    background:transparent;
    outline:none;
    resize:none;
    transition:border-color 0.15s ease;
  }
  .field input::placeholder,
  .field textarea::placeholder{color:#c7cbdb;font-weight:500;}
  .field input:focus,
  .field textarea:focus{border-color:var(--blue);}
  .field textarea{min-height:26px;}

  .form-bottom{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:12px;
    gap:16px;
    flex-wrap:wrap;
  }

  .upload{
    display:inline-flex;
    align-items:center;
    gap:9px;
    color:#5b6178;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
    border:none;
    background:none;
    padding:0;
  }
  .upload svg{width:19px;height:19px;color:#8b93a7;}

  .send-btn{
    display:inline-flex;
    align-items:center;
    gap:10px;
    background:var(--yellow);
    color:var(--navy);
    border:none;
    padding:15px 26px;
    border-radius:12px;
    font-family:inherit;
    font-size:13px;
    font-weight:800;
    letter-spacing:0.06em;
    text-transform:uppercase;
    cursor:pointer;
    transition:transform 0.15s ease, box-shadow 0.15s ease;
    box-shadow:0 10px 22px -8px rgba(249,216,87,0.7);
  }
  .send-btn:hover{transform:translateY(-2px);}
  .send-btn svg{width:15px;height:15px;}

  .footer-bar{
    position:relative;
    z-index:3;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:22px 56px 28px;
    border-top:1px solid var(--line);
  }

  .visit-site{
    display:inline-flex;
    align-items:center;
    gap:10px;
    color:#fff;
    text-decoration:none;
    font-size:20px;
    font-weight:700;
  }
  .visit-site svg{width:20px;height:20px;}

  .page-index{
    color:rgba(255,255,255,0.5);
    font-size:13px;
    font-weight:600;
    text-align:right;
    line-height:1.5;
  }
  .page-index b{color:#fff;}

  @media (max-width:900px){
    .content-wrap{grid-template-columns:1fr;}
    .form-card{margin:0 28px 28px;}
    .left-col{padding:36px 28px 24px;}
    .footer-bar{padding:20px 28px 24px;flex-direction:column;gap:14px;align-items:flex-start;}
  }
</style>
</head>
<body>
<header class="nv-header">   
  <div class="nv-wide">
    <a class="nv-brand" href="#"> <img src="/final/images/apricart-logo-reveal.svg" alt="Apricart" class="logo-img">
    <nav class="nv-nav">
      <a class="" href="#home.html">Home</a>
      <a class="" href="#aboutus.html">About Us</a>
      <a class="" href="#">Our Services</a>
    </nav>
    <div class="nv-header-actions">
      <a class="btn btn-primary" href="#">Request a Quote</a>
    </div>
  </div>
</header>
<div class="page-body">
<div class="stage">
  <div class="panel">

    <div class="content-wrap">
      <div class="left-col">
        <h1 class="headline">Contact us</h1>
        <div class="info-row">
          <div class="info-block">
            <div class="label">Our Address</div>
            <p>Suite 402, Tower B<br>Blue Area, Jinnah Avenue<br>Islamabad, Pakistan</p>
          </div>
          <div class="info-block">
            <div class="label">Our Contacts</div>
            <p><a href="mailto:hello@apricart.com">hello@apricart.com</a><br><a href="tel:+922100000000">+92 21 0000 0000</a></p>
          </div>
        </div>
        <div class="socials">
          <span class="follow">— follow us</span>
          <a href="#" aria-label="Facebook"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 8h-2a2 2 0 0 0-2 2v10M8 12h6"/></svg></a>
          <a href="#" aria-label="Instagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="4"/><circle cx="12" cy="12" r="3.2"/><circle cx="16.5" cy="7.5" r="0.6" fill="currentColor" stroke="none"/></svg></a>
          <a href="#" aria-label="Twitter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 5.9c-.7.3-1.5.6-2.3.7.8-.5 1.5-1.3 1.8-2.3-.8.5-1.7.8-2.6 1a4.1 4.1 0 0 0-7 3.7A11.6 11.6 0 0 1 3.4 4.6a4 4 0 0 0 1.3 5.5c-.6 0-1.3-.2-1.8-.5v.1c0 2 1.4 3.6 3.3 4a4.2 4.2 0 0 1-1.8.1 4.1 4.1 0 0 0 3.9 2.9A8.3 8.3 0 0 1 2 18.4a11.6 11.6 0 0 0 6.3 1.9c7.5 0 11.7-6.3 11.7-11.7v-.5c.8-.6 1.5-1.3 2-2.2z"/></svg></a>
          <a href="#" aria-label="YouTube"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2.5" y="6" width="19" height="12" rx="3"/><path d="M10.5 9.5l5 2.5-5 2.5z" fill="currentColor" stroke="none"/></svg></a>
        </div>
      </div>

      <form class="form-card" onsubmit="return false;">
        <div class="tag">Feedback Form</div>

        <div class="field">
          <label>Name</label>
          <input type="text" placeholder="Your full name">
        </div>
        <div class="field">
          <label>E-mail</label>
          <input type="email" placeholder="you@company.com">
        </div>
        <div class="field">
          <label>Phone</label>
          <input type="tel" placeholder="+92 3xx xxxxxxx">
        </div>
        <div class="field">
          <label>Message</label>
          <textarea rows="1" placeholder="How can we help?"></textarea>
        </div>

        <div class="form-bottom">
          <button type="button" class="upload">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 20h16"/></svg>
            Upload file
          </button>
          <button type="submit" class="send-btn">
            Send message
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>
        </div>
      </form>
    </div>

    <div class="footer-bar">
      <a class="visit-site" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M17 7H9M17 7v8"/></svg>
        Visit site
      </a>
      <div class="page-index"><b>Contact Us</b></div>
    </div>
  </div>
</div>

</div>
</body>
</html>
