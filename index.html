<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apricart - Smarter supply chains, built on technology</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #002072;
    --navy-2: #002072;
    --yellow: #f5b921;
    --blue: #3b5bfb;
    --white: #ffffff;
    --muted: #b9bdd6;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
    font-family: "Montserrat";
    background: var(--navy);
    color: var(--white);
    overflow-x: hidden;
  }

  .page {
    position: relative;
    height: 100vh;
    background: radial-gradient(circle at 78% 45%, #022682 0%, var(--navy) 55%);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* HERO */
  .hero {
  position: relative;
  display: flex;
  align-items: flex-start;
  justify-content: flex-start;
  max-width: 1440px;
  min-height: 0;
  margin: 0;
  padding: 0 0 0 60px; 
  flex: 1;
  gap: 40px;        
}

  .hero-content {
    max-width: 580px;
    flex-shrink: 0; 
    position: relative;  
    margin-left: 30px;
    margin-top: 70px;
    z-index: 5;
  }

 .hero-content .logo-img {
  height:150px;  
  width: auto;
  display: block;
  margin-bottom: 20px;
}

.headline-row {
  display: flex;
  align-items: stretch;
  gap: 20px;
  margin-bottom: 40px;  
}

.accent-bar {
  width: 6px;
  background: var(--yellow);
  border-radius: 3px;
  flex-shrink: 0;
}

h1 {
  font-size: 4.1rem;
  line-height: 1.08;
  font-weight: 700;
  letter-spacing: -1.5px;
}

  h1 .highlight { color: var(--yellow); }

  .market-label {
    font-size: 1.09rem;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 14px;
  }

  .market-cards {
    display: flex;
    gap: 16px;
  }

  .market-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 14px;
    border-width: 2px;
    padding: 18px 20px;
    min-width: 330px;
    text-decoration: none;
    color: var(--white);
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s, transform 0.2s;
  }

  .market-card:hover {
    background: rgba(255,255,255,0.07);
    border-color: var(--yellow);
    transform: translateY(-2px);
  }

  .market-card .country {
    font-size: 1.05rem;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .market-card .sub {
    font-size: 0.85rem;
    color: var(--muted);

  }

  .market-arrow {
    flex-shrink: 0;
    width: 34px;
    height: 34px;
    border-radius: 35%;
    background: var(--yellow);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--navy);
    font-weight: 1000;
    font-size: larger;

  }

  .hero-graphic {
    position: relative;
    width: min(52vw, 900px);
    margin-top: -70px;  
    max-width: 100%;
    margin-left: 230px;
    margin-right: -300px; 
    aspect-ratio: 1 / 1;
    flex-shrink: 0;
  }

  .hero-graphic svg {
    display: block;
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  .ring {
    fill: none;
    stroke: rgba(255,255,255,0.09);
  }

  .core-circle-bg {
    fill: url(#coreGradient);
  }

  .cart-icon {
    fill: var(--white);
  }

  .traveler {
    offset-rotate: 0deg;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }

  .orbit-1 { offset-path: path("M 310,4   A 306,306 0 1,1 309.9,4   Z"); animation-name: orbit-fwd; animation-duration: 60s; }
  .orbit-2 { offset-path: path("M 310,72  A 238,238 0 1,1 309.9,72  Z"); animation-name: orbit-rev; animation-duration: 38s; }
  .orbit-3 { offset-path: path("M 310,140 A 170,170 0 1,1 309.9,140 Z"); animation-name: orbit-fwd; animation-duration: 22s; }

  .orbit-1.square-rev { animation-name: orbit-rev; }
  .orbit-2.square-rev { animation-name: orbit-fwd; }
  .orbit-3.square-rev { animation-name: orbit-rev; }

  .orbit-3-lead {
    transform-origin: 310px 310px;
    animation-name: spin-fwd;
    animation-duration: 22s;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }

  @keyframes orbit-fwd {
    from { offset-distance: 0%; }
    to   { offset-distance: 100%; }
  }

  @keyframes orbit-rev {
    from { offset-distance: 100%; }
    to   { offset-distance: 0%; }
  }

  @keyframes spin-fwd {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  .core-group {
    animation: pulse 4s ease-in-out infinite;
    transform-origin: 310px 310px;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.035); }
  }

  .core-glow {
    animation: glow 4s ease-in-out infinite;
  }

  @keyframes glow {
    0%, 100% { opacity: 0.35; }
    50% { opacity: 0.6; }
  }

  @media (prefers-reduced-motion: reduce) {
    .traveler, .core-group, .core-glow, .orbit-3-lead {
      animation: none;
    }
  }

 @media (max-width: 1100px) {
    .page { height: auto; min-height: 100vh; }
    .hero {
      flex-direction: column;
      align-items: flex-start;
      text-align: left;
      padding: 0 40px;
      gap: 24px;
    }
    .hero-content {
      margin-left: 0;
      margin-top: 60px;
      max-width: 100%;
    }
    .hero-content .logo-img {
      height: 90px;
    }
    .hero-graphic {
      width: 460px;
      max-width: 90%;
      margin: 0 auto;
    }
    h1 { font-size: 3rem; }
    .market-cards { flex-wrap: wrap; }
    .market-card { min-width: 260px; }
  }
 
  /* ===== 700px: mobile ===== */
  @media (max-width: 700px) {
    .hero {
      padding: 0 24px;
      gap: 32px;
    }
    .hero-content {
      margin-top: 32px;
    }
    .hero-content .logo-img {
      height: 64px;
    }
    h1 {
      font-size: 2.2rem;
      margin-bottom: 24px;
    }
    .market-label { font-size: 0.95rem; }
    .market-cards {
      flex-direction: column;
      gap: 12px;
    }
    .market-card {
      min-width: unset;
      width: 100%;
      padding: 16px 18px;
    }
    .hero-graphic {
      width: 280px;
      max-width: 80%;
      margin: 20px auto 40px;
    }
  }

  @media (max-width: 420px) {
    h1 { font-size: 1.8rem; }
    .hero-content .logo-img { height: 52px; }
    .hero-graphic { width: 220px; }
  }
</style>
</head>
<body>
<div class="page">

  <section class="hero">
    <div class="hero-content">
        <div class=logo-slot">
            <img src="/images/logo_white.png" alt="Apricart" class="logo-img">
        </div>
        <div class="headline-row">
            <span class="accent-bar"></span>
            <h1>Smarter supply chains, <span class="highlight">built on technology.</span></h1>
          </div>

      <div class="market-label">Choose your market</div>
      <div class="market-cards">
        <a class="market-card" href="#Pakistan.html">
          <div>
            <div class="country">Pakistan</div>
            <div class="sub">Corporate Procurement</div>
          </div>
          <div class="market-arrow">&#707;</div>
        </a>
        <a class="market-card" href="#">
          <div>
            <div class="country">Saudi Arabia</div>
            <div class="sub">Food Distribution</div>
          </div>
          <div class="market-arrow">&#707;</div>
        </a>
      </div>
    </div>

    <div class="hero-graphic">
      <svg width="620" height="20" viewBox="0 0 620 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Apricart animated orbit mark with a shopping cart at its center">
        <defs>
          <radialGradient id="coreGradient" cx="35%" cy="30%" r="75%">
            <stop offset="0%" stop-color="#5470ff"/>
            <stop offset="70%" stop-color="#3b5bfb"/>
          </radialGradient>
          <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="18" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>

        <!-- Three concentric orbit rings -->
        <circle class="ring" cx="310" cy="310" r="306"/>
        <circle class="ring" cx="310" cy="310" r="238"/>
        <circle class="ring" cx="310" cy="310" r="170"/>

        <!-- Innermost ring: a fixed-length yellow arc leads the yellow dot -->
        <g class="orbit-3-lead">
          <path d="M 310 140 A 170 170 0 0 1 452.34 214.34" fill="none" stroke="#f5b921" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
        </g>
        <circle class="dot-yellow traveler orbit-3" r="8" cx="0" cy="0" fill="#f5b921"/>

        <!-- Shapes traveling along each ring's own path -->
        <circle class="dot-yellow traveler orbit-1" r="9" cx="0" cy="0" fill="#f5b921"/>
        <rect class="square-blue traveler orbit-1 square-rev" width="24" height="24" rx="7" x="-12" y="-12" fill="#3b5bfb" style="animation-delay:-21s;"/>

        <circle class="ring-yellow traveler orbit-2" r="10" cx="0" cy="0" fill="none" stroke="#f5b921" stroke-width="3" style="animation-delay:-11s;"/>
        <rect class="square-blue traveler orbit-2 square-rev" width="20" height="20" rx="6" x="-10" y="-10" fill="#3b5bfb" transform="rotate(45)" style="animation-delay:-28s;"/>

        <circle class="dot-white traveler orbit-3" r="5" cx="0" cy="0" fill="#ffffff" style="animation-delay:-6s;"/>

        <!-- Core circle with cart -->
        <g class="core-group">
          <circle class="core-circle-bg core-glow" cx="310" cy="310" r="135" filter="url(#softGlow)" opacity="0.35"/>
          <circle class="core-circle-bg" cx="310" cy="310" r="110"/>

          <g transform="translate(245.000,228.059) scale(0.100)">
            <g transform="translate(-20.000000,1620.972578) scale(0.100000,-0.100000)" class="cart-icon" fill="#ffffff" stroke="none">
              <path d="M5751 16123 c-230 -366 -271 -797 -156 -1630 l6 -43 1362 0 c2241 0
              3550 -24 3911 -71 164 -21 261 -84 294 -188 26 -84 22 -439 -7 -716 -84 -802
              -224 -1725 -277 -1827 -38 -74 -99 -78 -544 -29 -970 105 -3502 297 -4830 366
              -1420 73 -1821 39 -2535 -212 -625 -219 -985 -441 -1444 -888 -472 -460 -802
              -957 -1045 -1571 -257 -651 -285 -1159 -286 -5082 l0 -1634 27 6 c258 51 2164
              225 6793 621 2095 179 2549 221 3030 281 1208 148 1461 331 1639 1179 111 525
              457 3041 830 6030 180 1442 279 2278 368 3125 79 752 -72 1244 -522 1693 -324
              325 -573 460 -1002 547 -549 110 -1128 130 -3798 130 l-1760 0 -54 -87z"/>
              <path d="M8605 2213 c-387 -7 -738 -32 -832 -59 -84 -23 -93 -73 -53 -269 88
              -429 334 -895 612 -1161 729 -695 1987 -674 2709 45 301 301 591 878 593 1181
              1 109 -8 132 -62 159 -100 50 -424 84 -962 101 -272 8 -1621 11 -2005 3z"/>
              <path d="M380 2180 c-154 -12 -179 -48 -159 -235 50 -479 286 -914 694 -1278
              983 -876 2516 -496 3048 755 111 260 213 674 173 703 -59 44 -3312 91 -3756
              55z"/>
            </g>
          </g>
        </g>
      </svg>
    </div>
  </section>


</div>
</body>
</html>
